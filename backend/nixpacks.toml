[variables]
MISE_PYTHON_GITHUB_ATTESTATIONS = "false"

[phases.setup]
nixPkgs = ["python312"]

[phases.build]
cmds = ["pip install -r requirements.txt", "python manage.py collectstatic --noinput"]

[start]
cmd = "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p ${PORT:-8000} config.asgi:application"
