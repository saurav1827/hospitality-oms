services:
  web:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    ports: ['3000:3000']
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/operations/
    depends_on: [api]
  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000
    ports: ['8000:8000']
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: python manage.py process_notifications
    env_file: .env
    depends_on: [api, redis]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oms
      POSTGRES_USER: oms
      POSTGRES_PASSWORD: oms
    volumes: [oms_pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U oms -d oms'], interval: 5s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 3s, retries: 10 }
volumes:
  oms_pgdata:
